name: Render final paper figures

on:
  push:
    paths:
      - '.github/workflows/paper-figures.yml'
      - 'scripts/render_paper_figures_final.py'
      - 'docs/PAPER_FIGURE_STYLE.md'
      - 'outputs/fungibility_v0_6/**'
      - 'outputs/fungibility_v0_7/**'
      - 'outputs/fungibility_v0_8/**'
      - 'outputs/fungibility_v0_9/**'
      - 'outputs/fungibility_v1/**'
      - 'outputs/fungibility_dense_fraction/**'
      - 'outputs/fungibility_compression_poc/**'
      - 'outputs/fungibility_geometry_bank/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install plotting dependencies
        run: python -m pip install --upgrade pip numpy pandas matplotlib

      - name: Render final figure set
        run: python scripts/render_paper_figures_final.py

      - name: List outputs
        run: find figures/paper_final -maxdepth 3 -type f -printf '%p %k KB\n' | sort

      - name: Commit rendered figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/paper_final
          if git diff --cached --quiet; then
            echo "No figure changes."
          else
            git commit -m "figures: render unified final paper set"
            git push
          fi

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-final-figures
          path: figures/paper_final/
          retention-days: 30
